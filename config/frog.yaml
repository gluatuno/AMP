# ===========================================================================
# Frog AMP -> genome training-set pipeline  (initial project)
# ===========================================================================
# Goal: collect natural frog AMPs (APD3), map each to the genome of its source
# species, extract the gene's genomic sequence + features, and assemble a
# labelled matrix (AMP loci = positives) for a genome-wide AMP predictor.
#
# Species scope: ONLY frog species that have a sequenced genome (so AMP loci
# have real coordinates). AMPs from genome-less species are reported and set
# aside, not force-mapped onto a distant reference.
# ===========================================================================

outdir: "results_frog"
resources_dir: "resources_frog"

# --- AMP source ------------------------------------------------------------
apd:
  # APD3 has no bulk API; the fetcher queries by amphibian source and also
  # accepts a pre-downloaded FASTA/TSV placed here (offline fallback).
  query_organisms: ["Xenopus", "Rana", "Pelophylax", "Lithobates",
                    "Nanorana", "Bombina", "Bufo", "Hyla", "Phyllomedusa"]
  offline_fasta: "data/frog/apd_frog.fasta"      # optional manual export
  offline_metadata: "data/frog/apd_frog_meta.tsv" # optional: id<TAB>organism<TAB>family

# Curated species <-> genome table (edit / verify accessions before running).
species_table: "config/frog_species.tsv"
# Curated AMP family -> typical source genus (used when APD metadata is thin).
family_table: "config/frog_families.tsv"

params:
  threads: 8
  # homology (mature peptide -> species precursor protein)
  diamond_evalue: 1.0e-5
  diamond_min_pident: 85       # frog AMPs are more divergent than human
  min_query_cov: 0.80
  # locus / feature extraction
  flank_bp: 0                  # extra bp around the gene locus (Method 5 style)

# Feature matrix / model
model:
  negatives_per_positive: 3
  neg_window_strategy: "random_orf"   # random_orf | random_window | non_amp_gene
  classifier: "random_forest"         # random_forest | logreg (sklearn optional)
  cv_folds: 5
  seed: 0
